apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
spec:
  template:
    spec:
      containers:
        - name: api
          image: payments-api:latest
          securityContext:
            privileged: true
            runAsUser: 0
          env:
            - name: DATABASE_PASSWORD
              value: "production-db-password-2024"
